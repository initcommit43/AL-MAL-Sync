[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "al-mal-sync"
version = "0.1.0"
description = "Bidirectional sync tool between MyAnimeList and AniList"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]

[project.scripts]
al-mal-sync = "al_mal_sync.cli:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
